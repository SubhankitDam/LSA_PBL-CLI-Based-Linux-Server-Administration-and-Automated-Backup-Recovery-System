# Linux Server Administration PBL - project settings
# Keep this file simple: values are read by the Bash scripts.

# Shared directory used by the file-management module and backup scripts.
SHARED_DIR="/srv/linux-admin/shared"
SHARED_GROUP="linuxshare"

# Backups are stored outside the project directory and are root-readable only.
BACKUP_DIR="/var/backups/linux-admin"
BACKUP_PREFIX="shared"

# Backups older than this many days are removed after a successful backup.
# Set to 0 to disable automatic retention cleanup.
RETENTION_DAYS="14"

# Daily schedule used by scripts/install-cron.sh (five standard cron fields).
BACKUP_SCHEDULE="0 2 * * *"
CRON_FILE="/etc/cron.d/linux-admin-backup"
CRON_INSTALL_DIR="/usr/local/lib/linux-admin-pbl"
